<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ルナーランダム｜毎回ちがう形の月面ビリヤード</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
    background:radial-gradient(1000px 600px at 70% -10%, #1b2340 0%, #0a0d1d 55%, #05060f 100%);
    color:#e8ecff; min-height:100vh; display:flex; justify-content:center;
  }
  .wrap { width:min(920px, 97vw); padding:16px 4px 26px; text-align:center; }
  h1 { font-size:clamp(21px, 5vw, 30px); color:#f4f6ff; letter-spacing:.03em; }
  h1 .moon { filter:drop-shadow(0 0 8px rgba(240,240,200,.8)); }
  .sub { font-size:13px; opacity:.85; margin:5px 0 10px; line-height:1.6; }
  .hud { display:flex; justify-content:center; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  .stat { background:#141a33; border:1px solid #39406e; border-radius:10px; padding:5px 12px; font-size:14.5px; min-width:104px; }
  .stat b { color:#ffd76a; }
  button.act {
    background:#232c52; color:#e8ecff; border:1px solid #4a5590; border-radius:999px;
    padding:7px 14px; font-size:13.5px; cursor:pointer; font-family:inherit;
  }
  button.act:active { transform:scale(.96); }
  button.act.primary { background:#b97f1f; border-color:#e0aa3e; color:#fff8ea; font-weight:bold; }
  .fric { display:flex; align-items:center; gap:8px; background:#141a33; border:1px solid #39406e; border-radius:10px; padding:5px 12px; font-size:13px; }
  .fric input { width:130px; accent-color:#ffd76a; }
  .seg { display:inline-flex; background:#141a33; border:1px solid #39406e; border-radius:999px; overflow:hidden; }
  .seg button { border:0; background:transparent; color:#e8ecff; padding:7px 13px; font-size:13.5px; cursor:pointer; font-family:inherit; }
  .seg button.on { background:#b97f1f; color:#fff8ea; font-weight:bold; }
  canvas { width:100%; height:auto; display:block; margin:0 auto; touch-action:none; user-select:none; -webkit-user-select:none; }
  .msg { font-size:17px; font-weight:bold; min-height:1.5em; margin-top:8px; color:#ffd76a; }
  .hint { font-size:12.5px; opacity:.75; line-height:1.7; }
  .seed { font-size:11.5px; opacity:.5; margin-top:2px; }
  footer { margin-top:12px; font-size:13px; }
  footer a { color:#9fc0ff; }
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="moon">🌕</span> ルナーランダム</h1>
  <p class="sub">月面ビリヤード。1面だけ普通の長方形、<b>2面からは外形が完全ランダム</b> ― 直線だけでなく<b>曲線の壁</b>も混ざります。<br>全部のボールをブラックホール（ポケット）に落とせばクリア。</p>

  <div class="hud">
    <div class="stat">STAGE <b id="stageNo">1</b></div>
    <div class="stat">残り <b id="left">6</b> 個</div>
    <div class="stat">ショット <b id="shots">0</b></div>
    <div class="stat" id="targetStat" style="display:none">次の的 <b id="target">①</b></div>
    <div class="fric">フリクション <input type="range" id="fric" min="0" max="255" value="32"> <b id="fricVal">32</b></div>
  </div>
  <div class="hud">
    <div class="seg" id="modeSeg">
      <button data-m="free" class="on">フリー（順番なし）</button>
      <button data-m="order">ナインボール（順番）</button>
    </div>
    <button class="act" id="retryBtn">↺ この面をやり直す</button>
    <button class="act primary" id="nextBtn">🎲 次の面へ（新しい形）</button>
  </div>

  <canvas id="cv" width="880" height="660"></canvas>

  <p class="msg" id="msg"></p>
  <p class="hint">ドラッグした方向・長さでショット（ガイド線が出ます）。離すと発射。<br>
  フリーは順番なし（玉は全部おなじ色）。ナインボールは番号順 ― 最初に最小番号へ当てるのがルールで、外すとそのショットで落とした玉が戻るファウル。<br>
  手球が落ちたらファウルで、手球だけ打ち直しになります。</p>
  <p class="seed" id="seedLine"></p>

  <footer><a href="https://naway0141-source.github.io/">← てまごりゲーム集にもどる</a></footer>
</div>

<script>
'use strict';
/* ===== ルナーランダム =====
   1面＝長方形固定、2面以降＝外形を完全ランダム生成（星型多角形＋曲線エッジ）。
   ロジック部（生成・物理）と描画・入力部を分離。 */

// ---------- 共通ユーティリティ ----------
const FIELD_W = 880, FIELD_H = 660;
const BALL_R = 11, POCKET_R = 30, CAPTURE_R = 24, POCKET_GAP = 34;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
function distToSeg(px, py, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const L2 = dx * dx + dy * dy;
  let t = L2 ? ((px - a.x) * dx + (py - a.y) * dy) / L2 : 0;
  t = clamp(t, 0, 1);
  const x = a.x + dx * t, y = a.y + dy * t;
  return { d: Math.hypot(px - x, py - y), x, y, t };
}
function pointInPolygon(px, py, verts) {
  let inside = false;
  for (let i = 0, j = verts.length - 1; i < verts.length; j = i++) {
    const a = verts[i], b = verts[j];
    if ((a.y > py) !== (b.y > py) && px < (b.x - a.x) * (py - a.y) / (b.y - a.y) + a.x) inside = !inside;
  }
  return inside;
}
function segsIntersect(p1, p2, p3, p4) {
  const d = (p2.x - p1.x) * (p4.y - p3.y) - (p2.y - p1.y) * (p4.x - p3.x);
  if (!d) return false;
  const t = ((p3.x - p1.x) * (p4.y - p3.y) - (p3.y - p1.y) * (p4.x - p3.x)) / d;
  const u = ((p3.x - p1.x) * (p2.y - p1.y) - (p3.y - p1.y) * (p2.x - p1.x)) / d;
  return t > 0.001 && t < 0.999 && u > 0.001 && u < 0.999;
}
function polygonSimple(verts) {
  const n = verts.length;
  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      if (j === i + 1 || (i === 0 && j === n - 1)) continue;
      if (segsIntersect(verts[i], verts[(i + 1) % n], verts[j], verts[(j + 1) % n])) return false;
    }
  }
  return true;
}

// ---------- テーブル生成 ----------
// 壁は「輪郭点列（アウトライン）」から作る。ポケット位置では壁を欠く。
// p.oIdx = アウトライン上の頂点ポケット位置、p.oSeg = 辺途中ポケットのある区間
function buildWalls(outline, pockets) {
  const walls = [];
  const m = outline.length;
  const vPocket = new Set(), midPocket = new Map();
  for (const p of pockets) {
    if (p.oIdx !== undefined) vPocket.add(p.oIdx);
    if (p.oSeg !== undefined) midPocket.set(p.oSeg, p);
  }
  for (let k = 0; k < m; k++) {
    const a = outline[k], b = outline[(k + 1) % m];
    const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
    if (len < 1) continue;
    const ux = dx / len, uy = dy / len;
    const start = vPocket.has(k) ? Math.min(POCKET_GAP, len * 0.45) : 0;
    const end = vPocket.has((k + 1) % m) ? len - Math.min(POCKET_GAP, len * 0.45) : len;
    const mid = midPocket.get(k);
    const cuts = mid ? [[start, mid.t * len - POCKET_GAP], [mid.t * len + POCKET_GAP, end]] : [[start, end]];
    for (const [s, e] of cuts) {
      if (e - s > 6) walls.push({ a: { x: a.x + ux * s, y: a.y + uy * s }, b: { x: a.x + ux * e, y: a.y + uy * e } });
    }
  }
  return walls;
}

function makeBalls(stage, outline, pockets, cuePos, objPositions) {
  const colors = ['#f7d038', '#2456d6', '#d92b2b', '#7b2d8b', '#f07d18', '#1d9e4b'];
  const balls = [{ x: cuePos.x, y: cuePos.y, vx: 0, vy: 0, cue: true, potted: false, color: '#f5f2e8', num: 0 }];
  objPositions.forEach((p, i) => balls.push({ x: p.x, y: p.y, vx: 0, vy: 0, cue: false, potted: false, color: colors[i], num: i + 1 }));
  return {
    stage, verts: outline, pockets, walls: buildWalls(outline, pockets), balls,
    shots: 0, cleared: false, scratched: false,
    shotTaken: false, shotTarget: null, firstContact: null, shotPotted: []
  };
}

function stageOne() {
  const verts = [{ x: 110, y: 90 }, { x: 770, y: 90 }, { x: 770, y: 570 }, { x: 110, y: 570 }];
  const pockets = [
    { x: 110, y: 90, oIdx: 0 }, { x: 770, y: 90, oIdx: 1 },
    { x: 770, y: 570, oIdx: 2 }, { x: 110, y: 570, oIdx: 3 },
    { x: 440, y: 90, oSeg: 0, t: 0.5 }, { x: 440, y: 570, oSeg: 2, t: 0.5 }
  ];
  const objs = [
    { x: 600, y: 330 }, { x: 632, y: 311 }, { x: 632, y: 349 },
    { x: 664, y: 292 }, { x: 664, y: 330 }, { x: 664, y: 368 }
  ];
  return makeBalls(1, verts, pockets, { x: 250, y: 330 }, objs);
}

// 基本多角形の辺の一部を放物線状に膨らませて曲線エッジにする。
// 戻り値： アウトライン点列と、基本頂点→アウトライン添字の対応表
function densifyOutline(verts, pockets, rnd) {
  const n = verts.length;
  const gx = verts.reduce((s, v) => s + v.x, 0) / n, gy = verts.reduce((s, v) => s + v.y, 0) / n;
  const midEdges = new Set(pockets.filter(p => p.edge !== undefined).map(p => p.edge));
  const outline = [], vIdx = [];
  for (let i = 0; i < n; i++) {
    const a = verts[i], b = verts[(i + 1) % n];
    vIdx.push(outline.length);
    outline.push({ x: a.x, y: a.y });
    const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
    if (midEdges.has(i) || len <= 120 || rnd() >= 0.5) continue; // 直線のまま
    let nx = -dy / len, ny = dx / len;
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    if ((mx - gx) * nx + (my - gy) * ny < 0) { nx = -nx; ny = -ny; } // 法線を外向きに
    const sag = len * (0.10 + rnd() * 0.13) * (rnd() < 0.72 ? 1 : -1); // 外膨らみ多め、たまに内側
    const K = clamp(Math.round(len / 15), 5, 24);
    for (let k = 1; k < K; k++) {
      const s = k / K, h = sag * 4 * s * (1 - s);
      outline.push({ x: a.x + dx * s + nx * h, y: a.y + dy * s + ny * h });
    }
  }
  return { outline, vIdx };
}

// ランダム外形：中心から見て星型になる多角形（角度ソート済みの放射状生成）
// 変形度は「ゲームとして成り立つ」範囲：極端な針・狭い入り江は棄却する
function genRandomVerts(rnd) {
  const cx = FIELD_W / 2, cy = FIELD_H / 2;
  for (let attempt = 0; attempt < 60; attempt++) {
    const n = 6 + Math.floor(rnd() * 6); // 6〜11角
    const step = Math.PI * 2 / n;
    const baseRot = rnd() * Math.PI * 2;
    let s = [];
    let cur = 0.8 + rnd() * 0.18;
    for (let i = 0; i < n; i++) {
      cur = clamp(cur + (rnd() - 0.5) * 0.52, 0.62, 1.0);
      s.push(cur);
    }
    for (let pass = 0; pass < 2; pass++) {
      for (let i = 0; i < n; i++) {
        const prev = s[(i + n - 1) % n];
        s[i] = clamp(s[i], prev - 0.3, prev + 0.3);
      }
    }
    const verts = [];
    for (let i = 0; i < n; i++) {
      const t = baseRot + i * step + (rnd() - 0.5) * step * 0.66;
      verts.push({ x: cx + Math.cos(t) * 355 * s[i], y: cy + Math.sin(t) * 262 * s[i] });
    }
    let okShape = polygonSimple(verts);
    for (let i = 0; i < n && okShape; i++) {
      const a = verts[i], b = verts[(i + 1) % n], c = verts[(i + 2) % n];
      const e1 = Math.hypot(b.x - a.x, b.y - a.y);
      if (e1 < 85 || e1 > 480) okShape = false;
      const v1x = a.x - b.x, v1y = a.y - b.y, v2x = c.x - b.x, v2y = c.y - b.y;
      const ang = Math.acos(clamp((v1x * v2x + v1y * v2y) / (Math.hypot(v1x, v1y) * Math.hypot(v2x, v2y)), -1, 1));
      if (ang < 0.55) okShape = false;
    }
    if (okShape) return verts;
  }
  const n = 8, verts = [], rot = rnd() * Math.PI;
  for (let i = 0; i < n; i++) {
    const t = rot + i * Math.PI * 2 / n;
    verts.push({ x: cx + Math.cos(t) * 330, y: cy + Math.sin(t) * 245 });
  }
  return verts;
}

function genRandomStage(stageNo, seed) {
  const rnd = mulberry32(seed);
  for (let attempt = 0; attempt < 12; attempt++) {
    const verts = genRandomVerts(rnd);
    const n = verts.length;
    // ポケット候補：頂点（隣り合わないよう間引く）＋長い辺の途中
    const order = [...Array(n).keys()];
    for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    const chosen = [];
    for (const idx of order) {
      if (chosen.length >= 6) break;
      if (chosen.some(c => Math.min((c - idx + n) % n, (idx - c + n) % n) <= 1)) continue;
      chosen.push(idx);
    }
    if (chosen.length < 5) {
      for (const idx of order) { if (chosen.length >= 5) break; if (!chosen.includes(idx)) chosen.push(idx); }
    }
    const basePockets = chosen.map(idx => ({ x: verts[idx].x, y: verts[idx].y, vertex: idx }));
    for (let i = 0; i < n && basePockets.length < 8; i++) {
      const a = verts[i], b = verts[(i + 1) % n];
      if (Math.hypot(b.x - a.x, b.y - a.y) > 300 && rnd() < 0.7) {
        basePockets.push({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, edge: i, t: 0.5 });
      }
    }
    // 曲線化してアウトラインを作る。自己交差したらこの試行は破棄
    const { outline, vIdx } = densifyOutline(verts, basePockets, rnd);
    if (!polygonSimple(outline)) continue;
    const pockets = basePockets.map(p => p.vertex !== undefined
      ? { x: p.x, y: p.y, oIdx: vIdx[p.vertex] }
      : { x: p.x, y: p.y, oSeg: vIdx[p.edge], t: p.t });
    // 球の配置（アウトライン基準の棄却サンプリング）
    const edges = outline.map((v, i) => [v, outline[(i + 1) % outline.length]]);
    const clearOf = (x, y, balls, minEdge, minPocket, minBall) => {
      if (!pointInPolygon(x, y, outline)) return false;
      for (const [a, b] of edges) if (distToSeg(x, y, a, b).d < minEdge) return false;
      for (const p of pockets) if (Math.hypot(x - p.x, y - p.y) < minPocket) return false;
      for (const o of balls) if (Math.hypot(x - o.x, y - o.y) < minBall) return false;
      return true;
    };
    const gx = verts.reduce((s, v) => s + v.x, 0) / n, gy = verts.reduce((s, v) => s + v.y, 0) / n;
    let cue = null;
    for (let k = 0; k < 400 && !cue; k++) {
      const x = gx + (rnd() - 0.5) * 60, y = gy + (rnd() - 0.5) * 60;
      if (clearOf(x, y, [], 44, 52, 0)) cue = { x, y };
    }
    if (!cue) cue = { x: gx, y: gy };
    const objs = [];
    for (let k = 0; k < 3000 && objs.length < 6; k++) {
      const x = 70 + rnd() * (FIELD_W - 140), y = 70 + rnd() * (FIELD_H - 140);
      if (Math.hypot(x - cue.x, y - cue.y) < 56) continue;
      if (clearOf(x, y, objs, BALL_R + 15, POCKET_R + 18, BALL_R * 2 + 7)) objs.push({ x, y });
    }
    if (objs.length === 6) return makeBalls(stageNo, outline, pockets, cue, objs);
  }
  // 最終フォールバック：曲線なしの素直な面
  const verts = genRandomVerts(rnd);
  const n = verts.length;
  const pockets = verts.slice(0, 6).map((v, i) => ({ x: v.x, y: v.y, oIdx: i }));
  const gx = verts.reduce((s, v) => s + v.x, 0) / n, gy = verts.reduce((s, v) => s + v.y, 0) / n;
  const objs = [];
  for (let i = 0; i < 6; i++) objs.push({ x: gx + 130 * Math.cos(i * 1.05), y: gy + 95 * Math.sin(i * 1.05) });
  return makeBalls(stageNo, verts, pockets, { x: gx, y: gy }, objs);
}

function findFreeSpot(state) {
  const verts = state.verts, n = verts.length;
  const gx = verts.reduce((s, v) => s + v.x, 0) / n, gy = verts.reduce((s, v) => s + v.y, 0) / n;
  const edges = verts.map((v, i) => [v, verts[(i + 1) % n]]);
  for (let ring = 0; ring < 12; ring++) {
    for (let k = 0; k < 16; k++) {
      const t = k / 16 * Math.PI * 2, r = ring * 22;
      const x = gx + Math.cos(t) * r, y = gy + Math.sin(t) * r;
      if (!pointInPolygon(x, y, verts)) continue;
      let okSpot = true;
      for (const [a, b] of edges) if (distToSeg(x, y, a, b).d < 32) okSpot = false;
      for (const p of state.pockets) if (Math.hypot(x - p.x, y - p.y) < 46) okSpot = false;
      for (const o of state.balls) if (!o.potted && !o.cue && Math.hypot(x - o.x, y - o.y) < 30) okSpot = false;
      if (okSpot) return { x, y };
    }
  }
  return { x: gx, y: gy };
}

// ---------- 物理 ----------
function frictionK(fric) { return 0.15 + (fric / 255) * 1.85; }

function stepPhysics(st, dt, fric) {
  const damp = Math.exp(-frictionK(fric) * dt);
  const balls = st.balls.filter(b => !b.potted);
  for (const b of balls) {
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.vx *= damp; b.vy *= damp;
    if (Math.hypot(b.vx, b.vy) < 4) { b.vx = 0; b.vy = 0; }
  }
  for (const b of balls) {
    for (const p of st.pockets) {
      if (Math.hypot(b.x - p.x, b.y - p.y) < CAPTURE_R) {
        b.potted = true; b.vx = 0; b.vy = 0;
        if (b.cue) st.scratched = true;
        else if (st.shotTaken) st.shotPotted.push(b.num);
        break;
      }
    }
  }
  for (const b of balls) {
    if (b.potted) continue;
    for (const w of st.walls) {
      const r = distToSeg(b.x, b.y, w.a, w.b);
      if (r.d < BALL_R && r.d > 0.0001) {
        const nx = (b.x - r.x) / r.d, ny = (b.y - r.y) / r.d;
        b.x = r.x + nx * BALL_R; b.y = r.y + ny * BALL_R;
        const vn = b.vx * nx + b.vy * ny;
        if (vn < 0) { b.vx -= 1.92 * vn * nx; b.vy -= 1.92 * vn * ny; }
      }
    }
  }
  for (let i = 0; i < balls.length; i++) {
    for (let j = i + 1; j < balls.length; j++) {
      const A = balls[i], B = balls[j];
      if (A.potted || B.potted) continue;
      const dx = B.x - A.x, dy = B.y - A.y, d = Math.hypot(dx, dy);
      if (d < BALL_R * 2 && d > 0.0001) {
        const nx = dx / d, ny = dy / d, push = (BALL_R * 2 - d) / 2;
        A.x -= nx * push; A.y -= ny * push;
        B.x += nx * push; B.y += ny * push;
        const rvn = (B.vx - A.vx) * nx + (B.vy - A.vy) * ny;
        if (rvn < 0) {
          if (st.firstContact === null && st.shotTaken) {
            if (A.cue && !B.cue) st.firstContact = B.num;
            else if (B.cue && !A.cue) st.firstContact = A.num;
          }
          const imp = -0.975 * rvn;
          A.vx -= imp * nx; A.vy -= imp * ny;
          B.vx += imp * nx; B.vy += imp * ny;
        }
      }
    }
  }
}
function allStopped(st) { return st.balls.every(b => b.potted || (b.vx === 0 && b.vy === 0)); }
function remaining(st) { return st.balls.filter(b => !b.cue && !b.potted).length; }
function targetOf(st) {
  const nums = st.balls.filter(b => !b.cue && !b.potted).map(b => b.num);
  return nums.length ? Math.min(...nums) : null;
}

// ---------- 描画・入力部（ブラウザのみ） ----------
if (typeof document !== 'undefined' && document.getElementById('cv')) {
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const CIRCLED = ['①', '②', '③', '④', '⑤', '⑥'];
  let stage = 1, seed = 1, mode = 'free';
  let S = stageOne();
  let fric = 32, drag = null, AC = null;

  const stars = [];
  { const r = mulberry32(42); for (let i = 0; i < 130; i++) stars.push({ x: r() * FIELD_W, y: r() * FIELD_H, s: r() * 1.6 + 0.4, p: r() * 6.28 }); }

  function audio() {
    if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } }
    if (AC && AC.state === 'suspended') AC.resume();
    return AC;
  }
  function blip(f, t, type, g0) {
    const ac = audio(); if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(g0, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + t);
    o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + t);
  }

  function newStage(no, sd) {
    stage = no; seed = sd;
    S = no === 1 ? stageOne() : genRandomStage(no, sd);
    $('stageNo').textContent = no;
    $('msg').textContent = '';
    $('seedLine').textContent = no === 1 ? 'STAGE 1 は定番の長方形テーブル' : 'STAGE ' + no + ' ／ テーブルシード ' + sd;
    updateHud();
  }
  function updateHud() {
    $('left').textContent = remaining(S);
    $('shots').textContent = S.shots;
    const t = targetOf(S);
    $('targetStat').style.display = mode === 'order' ? '' : 'none';
    if (t) $('target').textContent = CIRCLED[t - 1];
  }

  function tablePath() {
    ctx.beginPath();
    S.verts.forEach((v, i) => i ? ctx.lineTo(v.x, v.y) : ctx.moveTo(v.x, v.y));
    ctx.closePath();
  }
  function drawBall(b) {
    if (b.cue) {
      ctx.fillStyle = '#f5f2e8';
      ctx.beginPath(); ctx.arc(b.x, b.y, BALL_R, 0, 6.29); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.stroke();
      ctx.fillStyle = 'rgba(120,120,130,.5)';
      ctx.beginPath(); ctx.arc(b.x - 3.5, b.y + 2, 2.2, 0, 6.29); ctx.fill();
      ctx.beginPath(); ctx.arc(b.x + 3, b.y - 3.5, 1.6, 0, 6.29); ctx.fill();
      return;
    }
    if (mode === 'free') {
      // フリー：番号なし・全部おなじ色のタマ
      const g = ctx.createRadialGradient(b.x - 4, b.y - 4, 2, b.x, b.y, BALL_R + 1);
      g.addColorStop(0, '#ffe9b0'); g.addColorStop(0.35, '#e8a33d'); g.addColorStop(1, '#b97a1e');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(b.x, b.y, BALL_R, 0, 6.29); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.stroke();
      return;
    }
    const g = ctx.createRadialGradient(b.x - 4, b.y - 4, 2, b.x, b.y, BALL_R + 1);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.25, b.color); g.addColorStop(1, b.color);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(b.x, b.y, BALL_R, 0, 6.29); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(b.x, b.y, 5.6, 0, 6.29); ctx.fill();
    ctx.fillStyle = '#111'; ctx.font = 'bold 8.5px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(b.num, b.x, b.y + 0.5);
  }
  function aimGuide() {
    if (!drag || S.cleared) return null;
    const cue = S.balls[0];
    if (cue.potted) return null;
    const dx = drag.cx - drag.sx, dy = drag.cy - drag.sy;
    const len = Math.hypot(dx, dy);
    if (len < 8) return null;
    const ux = dx / len, uy = dy / len;
    const power = clamp(len / 260, 0, 1);
    let bestT = 1400, hitBall = null;
    for (const w of S.walls) {
      const ex = w.b.x - w.a.x, ey = w.b.y - w.a.y;
      const den = ux * ey - uy * ex;
      if (Math.abs(den) < 1e-9) continue;
      const t = ((w.a.x - cue.x) * ey - (w.a.y - cue.y) * ex) / den;
      const s = ((w.a.x - cue.x) * uy - (w.a.y - cue.y) * ux) / den;
      if (t > 0 && s >= 0 && s <= 1 && t < bestT) { bestT = t; hitBall = null; }
    }
    for (const b of S.balls) {
      if (b.cue || b.potted) continue;
      const ox = b.x - cue.x, oy = b.y - cue.y;
      const proj = ox * ux + oy * uy;
      if (proj <= 0) continue;
      const perp2 = ox * ox + oy * oy - proj * proj;
      const rr = BALL_R * 2;
      if (perp2 < rr * rr) {
        const t = proj - Math.sqrt(rr * rr - perp2);
        if (t < bestT) { bestT = t; hitBall = b; }
      }
    }
    return { ux, uy, power, hitT: bestT, hitBall, cue };
  }
  function draw(now) {
    ctx.clearRect(0, 0, FIELD_W, FIELD_H);
    ctx.fillStyle = '#05060f'; ctx.fillRect(0, 0, FIELD_W, FIELD_H);
    for (const st of stars) {
      ctx.globalAlpha = 0.35 + 0.3 * Math.sin(now * 0.001 + st.p);
      ctx.fillStyle = '#cdd8ff';
      ctx.fillRect(st.x, st.y, st.s, st.s);
    }
    ctx.globalAlpha = 1;
    tablePath();
    ctx.strokeStyle = '#5b6474'; ctx.lineWidth = 26; ctx.lineJoin = 'round'; ctx.stroke();
    const fg = ctx.createRadialGradient(FIELD_W / 2, FIELD_H / 2, 80, FIELD_W / 2, FIELD_H / 2, 520);
    fg.addColorStop(0, '#2c3a63'); fg.addColorStop(1, '#1a2342');
    ctx.fillStyle = fg; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 2; ctx.stroke();
    for (const p of S.pockets) {
      ctx.save();
      ctx.shadowColor = 'rgba(150,90,255,.9)'; ctx.shadowBlur = 16;
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(p.x, p.y, POCKET_R, 0, 6.29); ctx.fill();
      ctx.restore();
      ctx.strokeStyle = 'rgba(190,160,255,.55)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, POCKET_R - 2, 0, 6.29); ctx.stroke();
    }
    // ナインボール：次の的を金リングで表示
    if (mode === 'order' && !S.cleared && allStopped(S)) {
      const t = targetOf(S);
      const tb = S.balls.find(b => b.num === t);
      if (tb && !tb.potted) {
        ctx.strokeStyle = '#ffd76a'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(tb.x, tb.y, BALL_R + 5 + 1.6 * Math.sin(now * 0.006), 0, 6.29); ctx.stroke();
        ctx.fillStyle = '#ffd76a';
        ctx.beginPath();
        ctx.moveTo(tb.x - 6, tb.y - BALL_R - 16); ctx.lineTo(tb.x + 6, tb.y - BALL_R - 16); ctx.lineTo(tb.x, tb.y - BALL_R - 8);
        ctx.closePath(); ctx.fill();
      }
    }
    const aim = aimGuide();
    if (aim && allStopped(S)) {
      const gx = aim.cue.x + aim.ux * aim.hitT, gy = aim.cue.y + aim.uy * aim.hitT;
      ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 1.6;
      ctx.setLineDash([6, 6]);
      ctx.beginPath(); ctx.moveTo(aim.cue.x, aim.cue.y); ctx.lineTo(gx, gy); ctx.stroke();
      ctx.setLineDash([]);
      ctx.strokeStyle = 'rgba(255,255,255,.5)';
      ctx.beginPath(); ctx.arc(gx, gy, BALL_R, 0, 6.29); ctx.stroke();
      if (aim.hitBall) {
        const b = aim.hitBall;
        let nx = b.x - gx, ny = b.y - gy; const nl = Math.hypot(nx, ny) || 1; nx /= nl; ny /= nl;
        ctx.strokeStyle = 'rgba(255,215,106,.9)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x + nx * 34, b.y + ny * 34); ctx.stroke();
      }
      ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(FIELD_W - 26, 120, 10, 220);
      ctx.fillStyle = aim.power > 0.85 ? '#ff6b6b' : '#ffd76a';
      ctx.fillRect(FIELD_W - 26, 120 + 220 * (1 - aim.power), 10, 220 * aim.power);
    }
    for (const b of S.balls) if (!b.potted) drawBall(b);
    if (S.cleared) {
      ctx.fillStyle = 'rgba(5,6,20,.45)'; ctx.fillRect(0, 0, FIELD_W, FIELD_H);
      ctx.fillStyle = '#ffd76a'; ctx.font = 'bold 44px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('🎉 STAGE CLEAR!', FIELD_W / 2, FIELD_H / 2 - 14);
      ctx.font = '20px sans-serif'; ctx.fillStyle = '#fff';
      ctx.fillText(S.shots + ' ショットでクリア', FIELD_W / 2, FIELD_H / 2 + 30);
    }
  }

  let lastT = 0, acc = 0;
  function frame(ts) {
    requestAnimationFrame(frame);
    const now = ts || 0;
    let dt = Math.min((now - lastT) / 1000, 0.05); lastT = now;
    if (!allStopped(S)) {
      acc += dt;
      const h = 1 / 240;
      while (acc > h) { stepPhysics(S, h, fric); acc -= h; }
      if (allStopped(S)) onShotEnd();
    }
    draw(now);
  }
  function onShotEnd() {
    let foulMsg = '';
    if (mode === 'order' && S.shotTaken) {
      const wrongFirst = S.firstContact !== null && S.firstContact !== S.shotTarget;
      const whiff = S.firstContact === null;
      if (wrongFirst || whiff) {
        for (const num of S.shotPotted) {
          const b = S.balls.find(x => x.num === num);
          if (!b) continue;
          const spot = findFreeSpot(S);
          b.x = spot.x; b.y = spot.y; b.potted = false; b.vx = 0; b.vy = 0;
        }
        foulMsg = whiff ? '💫 ファウル！ どの玉にも当たらなかった' : '💫 ファウル！ 最初に当てるのは ' + S.shotTarget + ' 番';
        blip(150, 0.25, 'sawtooth', 0.1);
      }
    }
    S.shotTaken = false; S.shotPotted = []; S.firstContact = null;
    if (remaining(S) === 0 && !S.cleared) {
      S.cleared = true;
      $('msg').textContent = '🎉 クリア！ ' + S.shots + 'ショット';
      [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => blip(f, 0.15, 'triangle', 0.09), i * 100));
    } else if (S.scratched) {
      const cue = S.balls[0];
      const spot = findFreeSpot(S);
      cue.x = spot.x; cue.y = spot.y; cue.potted = false; cue.vx = 0; cue.vy = 0;
      S.scratched = false;
      $('msg').textContent = foulMsg ? foulMsg + '（手球も打ち直し）' : '💫 手球が落ちた…打ち直し';
      blip(160, 0.25, 'sawtooth', 0.1);
    } else {
      $('msg').textContent = foulMsg;
    }
    updateHud();
  }
  requestAnimationFrame(frame);

  function toField(e) {
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) * FIELD_W / r.width, y: (e.clientY - r.top) * FIELD_H / r.height };
  }
  cv.addEventListener('pointerdown', e => {
    if (!allStopped(S) || S.cleared) return;
    audio();
    const p = toField(e);
    drag = { sx: p.x, sy: p.y, cx: p.x, cy: p.y };
    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', e => {
    if (!drag) return;
    const p = toField(e);
    drag.cx = p.x; drag.cy = p.y;
  });
  cv.addEventListener('pointerup', e => {
    if (!drag) return;
    const aim = aimGuide();
    drag = null;
    if (!aim || aim.power < 0.05) return;
    const cue = S.balls[0];
    const sp = 200 + aim.power * 1050;
    S.shotTarget = targetOf(S);
    S.firstContact = null;
    S.shotPotted = [];
    S.shotTaken = true;
    cue.vx = aim.ux * sp; cue.vy = aim.uy * sp;
    S.shots++;
    $('msg').textContent = '';
    updateHud();
    blip(300 + aim.power * 300, 0.08, 'square', 0.07);
  });
  cv.addEventListener('pointercancel', () => { drag = null; });

  $('fric').addEventListener('input', e => { fric = +e.target.value; $('fricVal').textContent = fric; });
  $('modeSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.dataset.m === mode) return;
    [...$('modeSeg').children].forEach(x => x.classList.toggle('on', x === b));
    mode = b.dataset.m;
    newStage(stage, seed);
  });
  $('retryBtn').addEventListener('click', () => newStage(stage, seed));
  $('nextBtn').addEventListener('click', () => {
    const ns = Math.floor(Math.random() * 899999) + 100000;
    newStage(stage + 1, ns);
  });
  newStage(1, 1);
}
</script>
</body>
</html>
